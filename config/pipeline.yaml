# All thresholds and weights for the Moon-analog pipeline, in one place.
#
# Spec: docs/HANDOFF_terrain.md + team decisions of 14 Nov 2026
# (docs/Moon_Analog_Criteria_and_Datasets.md is not in the repo yet).
# "(interpreted)" = a rule the spec does not pin down; chosen by us, change freely.
# "(team start value)" = a tunable number the team picked, not a measured fact.

grid:
  cell_km: 15                 # ~ size of an Artemis III candidate region
  res_m: 60                   # common metric grid for Earth and Moon (decision 14 Nov)
  resampling: bilinear        # unsure: for 5 m LOLA -> 60 m, 'average' may be better; compare later

# --- Stage 1: hard filters per cell (land cover, settlements). NO slope filter here. --------
filter:
  landcover_res_m: 100        # WorldCover read resolution (COG overviews; 10 m native)

  # ESA WorldCover 2021 v200 classes. Every class except 0 (no data) must be in exactly one list.
  drop_classes: [10, 40, 50, 80, 90, 95]   # tree, cropland, built-up, water, herbaceous wetland, mangroves
  keep_classes: [20, 30, 60, 70, 100]      # shrub, grass, bare/sparse, snow & ice, moss & lichen

  built_up_classes: [50]
  built_up_buffer_m: 2000     # mask everything within 2 km of built-up
  water_classes: [80, 90]     # water + herbaceous wetland
  water_buffer_m: 200         # (team start value)

  min_cell_frac: 0.5          # (team start value) drop edge cells smaller than this share of a full cell
  min_land: 0.9               # min share of the cell with land-cover data; drops ocean / coast cells
  min_usable: 0.5             # (team start value) min share of the cell that is usable after masking
  min_patch_km2: 2.0          # (team start value) largest connected usable patch in the cell
  patch_connectivity: 8       # (interpreted) 8 = diagonal neighbours connect, 4 = edges only

  max_pop_per_km2: 10         # only applied when a GHS-POP raster is given (--pop)

# --- Stage 2: Polar terrain criteria (DEM only), per surviving cell, on the 60 m grid --------
# Criterion numbers follow the team plan (HANDOFF_terrain.md table).
polar:
  # The cell is scored as ONE coherent place: a depression (bowl) + the walls around it + a
  # base spot near it. Every qualifying depression whose low point lies inside the cell is a
  # candidate; the best candidate (highest weighted score) is the cell's result.
  buffer_m: 5500              # DEM read around each cell = depression search margin (5 km) + 0.5 km.
                              # Depressions crossing the cell border are found whole; only those whose
                              # low point is inside the cell count, so nothing is counted twice.
  relief_window_m: 5000       # local relief layer of compute_terrain; NOT used for criterion 9 any more
  rim_search_rel: 1.3         # (interpreted) criterion 9: rim crest = highest point per 1 deg azimuth
                              # within 1.3 x bowl radius of the low point (the filled edge lies inside the crest)
  roughness_window_px: 3      # criterion 13: std of elevation in 3x3 px (180 m at 60 m), median over the
                              # bowl + rim ring (bowl plus everything within rim_search_rel x r), Earth and Moon

  min_depression_depth_m: 50     # (team start value) criterion 7: shallower depressions are ignored
  min_depression_width_m: 1000   # (team start value) criterion 7: narrower depressions are ignored
  require_depression: true       # (team choice 14 Nov) true: a cell with no qualifying bowl is dropped.
                                 # (false would score it, anchored at its lowest pixel, with bowl = 0;
                                 #  such bowl-less cells outranked bowls in the Mustang run of 14 Nov)
  max_elongation: 2.0            # (interpreted start value) criterion 7: longest axis / equivalent diameter
                                 # of the filled depression; above this it is a valley, not a bowl (circle = 1)
  pad_m: 200                  # criterion 10: base pad ~200 m -> 3x3 px at 60 m
  max_base_to_bowl_km: 1      # (team choice 14 Nov) criterion 10: base pad "on the rim" = outside the bowl
                              # (not on its floor), pad centre at most 1 km outside the bowl edge (Earth and Moon)
  max_base_to_low_km: 5       # (team start value) criterion 10, places WITHOUT a bowl only: pad centre
                              # within 5 km of the lowest point
  max_base_slope_deg: 15      # criterion 10: candidate rejected if its flattest usable pad is steeper (only slope filter)
  wall_ring_rel: [0.5, 1.0]   # (team choice 14 Nov) criterion 11: inner walls = ring of 0.5-1.0 x bowl
                              # radius r around the low point; r = equivalent radius of the filled
                              # depression (same on Earth and Moon). The outer flank does not count.
  wall_ring_m: [500, 3000]    # (interpreted) criterion 11, places WITHOUT a bowl only: fixed ring
  steep_slope_deg: 20         # (interpreted) criterion 14: what counts as steep terrain
  pole_sector_deg: 45         # (interpreted) criterion 14: facing the pole = aspect within +-45 deg of it;
                              # counted within the wall ring's outer radius (the walls of this place)

  # How each raw value becomes a 0-1 score (src/pipeline/scoring.py), first match wins:
  #   lunar target    -> exp(-((earth - moon) / tolerance)^2): 1 at the lunar value, 0.37 one tolerance
  #                      away, 0.02 two away. Comparable across runs. Targets: config/lunar_targets.json
  #                      (used only when verified: true; then a tolerance is required).
  #   scale: [a, b]   -> direct linear score, a -> 1 ... b -> 0 if direction lower (reverse if higher)
  #   neither, direction higher/lower -> percentile rank among all candidate places of THIS run
  #   direction target, no target     -> score None ("no data") until the lunar value exists
  # Tolerances: (team choice, start values 14 Nov, not measured) - how far from the Moon still counts
  # as similar. Size-dependent c9 gets a deliberately large tolerance (scale decision 14 Nov).
  # Weights: (team start value) all equal; adjustable for the jury demo.
  criteria:
    # light criteria 1-4: weights and tolerances are team start values (14 Nov), until Mateo's lunar targets exist
    # they are rank-scored (no lunar value yet)
    c1_sunny_ridge: {weight: 1.0, direction: higher, tolerance: 0.1}  # max lit fraction in rim zone / flat-land lit fraction
    c2_dark_floor:  {weight: 1.0, direction: higher, tolerance: 0.2}  # p99 terrain shadow fraction (1 - lit / flat_lit) in the floor zone
    c3_light_dark:  {weight: 1.0, direction: lower, tolerance: 0.5}   # distance darkest floor px -> sunniest rim px, / r
    c4_grazing_sun: {weight: 1.0, direction: lower, tolerance: 5}     # deg, max Sun elevation over the year (latitude only)
    c5_sky_view:   {weight: 0.0, direction: lower, tolerance: 0.1}    # share of sky visible from the floor. DISPLAY ONLY (team choice 14 Nov):
                                                                      # duplicates c7 for simple bowls (r -0.91 over 6 bowl cells) and overlaps c2
                                                                      # (r -0.91), which has the lunar comparison. Still computed for the radar charts.
    c7_bowl:       {weight: 1.0, direction: higher, tolerance: 0.05}  # depth / width of closed depression
    c9_relief:     {weight: 0.0, direction: higher, tolerance: 1500}  # m, rim-to-floor depth of the bowl. DISPLAY ONLY (team choice 14 Nov: size-dependent)
    c10_flat_base: {weight: 1.0, direction: lower, scale: [0, 15], tolerance: 3}  # deg, flattest usable pad on the rim
    c11_walls:     {weight: 1.0, direction: higher, tolerance: 5}     # deg, mean slope in ring 0.5-1.0 x bowl radius
    c13_roughness: {weight: 1.0, direction: target, tolerance: 10}    # m, median std of elevation over bowl + rim ring
    c14_aspect:    {weight: 0.0, direction: higher, scale: [0, 1], tolerance: 0.15}  # share of steep pixels facing the nearer pole. DISPLAY ONLY (team choice 14 Nov: "toward the pole" is no fixed direction at Shackleton)

# --- Light criteria 1-5 (src/pipeline/light.py), on the same grid and zones as the terrain ---------
# c5 sky view (Earth and Moon, same function); c1-c4 Sun simulation (Earth here, Moon in lunar_light.py)
light:
  floor_max_slope_deg: 10     # (interpreted) floor zone = bowl pixels flatter than this, connected to the low point
  horizon_rel: 2.0            # (interpreted) look-out distance for horizons = 2 x bowl radius r (relative,
                              # like the other zones). Earth: bowls with r > ~2.7 km near the cell edge
                              # reach past polar.buffer_m -> terrain there counts as invisible (SVF a bit high)
  n_azimuths: 72              # horizon sectors (every 5 deg), as in shadowsim
  sun: true                   # year of Sun simulation for c1-c4 (Earth). "Lit" = Sun CENTRE above the horizon (point Sun, not disk)
  year: 2026                  # (interpreted) one calendar year, UTC
  step_min: 60                # time step, as in shadowsim
  near_permanent_shadow: 0.9  # display: floor share with terrain shadow fraction >= this (shadowsim's threshold)
  bodies:                     # curvature drop of distant terrain: d^2 (1 - k) / (2 R)
    earth: {radius_m: 6371000, refraction_k: 0.13}   # shadowsim values (standard terrestrial refraction)
    moon:  {radius_m: 1737400, refraction_k: 0.0}    # LOLA reference sphere; no atmosphere
