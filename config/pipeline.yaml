# All thresholds and weights for the Moon-analog pipeline, in one place.
#
# Spec: docs/HANDOFF_terrain.md + team decisions of 14 Nov 2026
# (docs/Moon_Analog_Criteria_and_Datasets.md is not in the repo yet).
# "(interpreted)" = a rule the spec does not pin down; chosen by us, change freely.
# "(team start value)" = a tunable number the team picked, not a measured fact.

grid:
  cell_km: 15                 # ~ size of an Artemis III candidate region
  res_m: 60                   # common metric grid for Earth and Moon (decision 14 Nov)
  resampling: bilinear        # unsure: for 5 m LOLA -> 60 m, 'average' may be better; compare later

# --- Stage 1: hard filters per cell (land cover, settlements). NO slope filter here. --------
filter:
  landcover_res_m: 100        # WorldCover read resolution (COG overviews; 10 m native)

  # ESA WorldCover 2021 v200 classes. Every class except 0 (no data) must be in exactly one list.
  drop_classes: [10, 40, 50, 80, 90, 95]   # tree, cropland, built-up, water, herbaceous wetland, mangroves
  keep_classes: [20, 30, 60, 70, 100]      # shrub, grass, bare/sparse, snow & ice, moss & lichen

  built_up_classes: [50]
  built_up_buffer_m: 2000     # mask everything within 2 km of built-up
  water_classes: [80, 90]     # water + herbaceous wetland
  water_buffer_m: 200         # (team start value)

  min_cell_frac: 0.5          # (team start value) drop edge cells smaller than this share of a full cell
  min_land: 0.9               # min share of the cell with land-cover data; drops ocean / coast cells
  min_usable: 0.5             # (team start value) min share of the cell that is usable after masking
  min_patch_km2: 2.0          # (team start value) largest connected usable patch in the cell
  patch_connectivity: 8       # (interpreted) 8 = diagonal neighbours connect, 4 = edges only

  max_pop_per_km2: 10         # only applied when a GHS-POP raster is given (--pop)

# --- Stage 2: Polar terrain criteria (DEM only), per surviving cell, on the 60 m grid --------
# Criterion numbers follow the team plan (HANDOFF_terrain.md table).
polar:
  # The cell is scored as ONE coherent place: a depression (bowl) + the walls around it + a
  # base spot near it. Every qualifying depression whose low point lies inside the cell is a
  # candidate; the best candidate (highest weighted score) is the cell's result.
  buffer_m: 5500              # DEM read around each cell = depression search margin (5 km) + 0.5 km.
                              # Depressions crossing the cell border are found whole; only those whose
                              # low point is inside the cell count, so nothing is counted twice.
  relief_window_m: 5000       # criterion 9: relief within ~5 km of the low point
  roughness_window_px: 3      # criterion 13: std of elevation in 3x3 px (180 m at 60 m), cell-wide

  min_depression_depth_m: 50     # (team start value) criterion 7: shallower depressions are ignored
  min_depression_width_m: 1000   # (team start value) criterion 7: narrower depressions are ignored
  require_depression: false      # (interpreted) false: a cell with no qualifying depression is still
                                 # scored, anchored at its lowest pixel, with bowl = 0. true: drop it.
  pad_m: 200                  # criterion 10: base pad ~200 m -> 3x3 px at 60 m
  max_base_to_low_km: 5       # (team start value) criterion 10: base pad centre within 5 km of the low point
                              # (same radius as the drivable share in criterion 12)
  max_base_slope_deg: 15      # criterion 10: candidate rejected if its flattest usable pad is steeper (only slope filter)
  wall_ring_m: [500, 3000]    # (interpreted) criterion 11: ring around the low point counted as "walls"
  steep_slope_deg: 20         # (interpreted) criterion 14: what counts as steep terrain
  pole_sector_deg: 45         # (interpreted) criterion 14: facing the pole = aspect within +-45 deg of it;
                              # counted within wall_ring_m[1] of the low point (the walls of this place)

  # How each raw value becomes a 0-1 score (src/pipeline/scoring.py):
  #   scale: [a, b]   -> direct linear score, a -> 1 ... b -> 0 if direction lower (reverse if higher)
  #   lunar target    -> similarity to the lunar value (not implemented until targets exist).
  #                      Targets live in config/lunar_targets.json (used only when verified: true).
  #   neither, direction higher/lower -> percentile rank among all candidate places of THIS run
  #                                      (score_method=rank: only comparable within one run)
  #   direction target, no target     -> score None ("no data") until the lunar value exists
  # Weights: (team start value) all equal; adjustable for the jury demo.
  criteria:
    c7_bowl:       {weight: 1.0, direction: higher}   # depth / width of closed depression
    c9_relief:     {weight: 1.0, direction: higher}   # m, max-min in 5 km window at the low point
    c10_flat_base: {weight: 1.0, direction: lower, scale: [0, 15]}  # deg, mean slope of flattest usable pad
    c11_walls:     {weight: 1.0, direction: higher}   # deg, mean slope in ring around low point
    c13_roughness: {weight: 1.0, direction: target}   # m, median std of elevation
    c14_aspect:    {weight: 1.0, direction: higher, scale: [0, 1]}  # share of steep pixels facing the nearer pole
